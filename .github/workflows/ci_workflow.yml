name: CI Workflow

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, Linux, X64, vmss-DataAI]
    steps:
      - uses: actions/checkout@v4
      - name: Check required folders
        shell: bash
        run: |
          set -euo pipefail
          required_folders=(
            "adf/adf_resources"
            "fabric"
            "Metadata-SQL-DB"
          )

          for folder in "${required_folders[@]}"; do
            if [ ! -d "$folder" ]; then
              echo "ERROR: Required folder not found: $folder"
              exit 1
            fi

            echo "Found required folder: $folder"
          done
