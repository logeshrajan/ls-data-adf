name: ADF Manual Deployment

run-name: ${{ format('Manual Deploy - {0}', inputs.environment_name) }}

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Deployment environment"
        required: true
        default: sit
        type: choice
        options:
          - sit
          - uat
          - prd
          - dr

permissions:
  contents: read
  id-token: write

env:
  ADF_RESOURCES_PATH: ./adf/adf_resources
  TRIGGER_PATH: ./adf/adf_resources/trigger
  ARM_OUTPUT_DIR: ./adf/adf_resources/armTemplate
  ARM_TEMPLATE_JSON: ARMTemplateForFactory.json
  ARM_PARAMETERS_JSON: ARMTemplateParametersForFactory.json

jobs:
  # ---------------------------------------------------------------------------
  #  MANUAL - workflow_dispatch
  #  Deploys to any environment (including DR) on demand.
  #  Exports ARM template from the target environment's factory definition,
  #  then runs the full deploy pipeline in a single job.
  #  GitHub environment protection rules still apply: if prod or uat have
  #  required reviewers configured, approval is enforced even for manual runs.
  # ---------------------------------------------------------------------------
  deploy_manual:
    name: Manual Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment mapping
        id: resolve_env
        shell: bash
        env:
          AZURE_DEV_SUBSCRIPTION_ID: ${{ vars.AZURE_DEV_SUBSCRIPTION_ID }}
          AZURE_SIT_SUBSCRIPTION_ID: ${{ vars.AZURE_SIT_SUBSCRIPTION_ID }}
          AZURE_UAT_SUBSCRIPTION_ID: ${{ vars.AZURE_UAT_SUBSCRIPTION_ID }}
          AZURE_PROD_SUBSCRIPTION_ID: ${{ vars.AZURE_PROD_SUBSCRIPTION_ID }}
          AZURE_SIT_CLIENT_ID: ${{ vars.AZURE_SIT_CLIENT_ID }}
          AZURE_UAT_CLIENT_ID: ${{ vars.AZURE_UAT_CLIENT_ID }}
          AZURE_PROD_CLIENT_ID: ${{ vars.AZURE_PROD_CLIENT_ID }}
          AZURE_SIT_RESOURCE_GROUP: ${{ vars.AZURE_SIT_RESOURCE_GROUP }}
          AZURE_SIT_DATA_FACTORY: ${{ vars.AZURE_SIT_DATA_FACTORY }}
          AZURE_UAT_RESOURCE_GROUP: ${{ vars.AZURE_UAT_RESOURCE_GROUP }}
          AZURE_UAT_DATA_FACTORY: ${{ vars.AZURE_UAT_DATA_FACTORY }}
          AZURE_PROD_RESOURCE_GROUP: ${{ vars.AZURE_PROD_RESOURCE_GROUP }}
          AZURE_PROD_DATA_FACTORY: ${{ vars.AZURE_PROD_DATA_FACTORY }}
        run: |
          set -euo pipefail

          environment_name="${{ inputs.environment_name }}"
          infra_env="$environment_name"
          overrides_env="$environment_name"

          # DR shares SIT infrastructure but uses its own override files.
          if [ "$environment_name" = "dr" ]; then
            infra_env="sit"
            overrides_env="dr"
          fi

          resource_group=""
          data_factory=""
          env_overrides_file="./adf/deploy/overrides/${overrides_env}.overrides.json"
          env_adf_config_file="./adf/deploy/overrides/${overrides_env}.template.overrides.json"

          case "$infra_env" in
            sit)
              subscription_id="$AZURE_SIT_SUBSCRIPTION_ID"
              client_id="$AZURE_SIT_CLIENT_ID"
              resource_group="$AZURE_SIT_RESOURCE_GROUP"
              data_factory="$AZURE_SIT_DATA_FACTORY"
              ;;
            uat)
              subscription_id="$AZURE_UAT_SUBSCRIPTION_ID"
              client_id="$AZURE_UAT_CLIENT_ID"
              resource_group="$AZURE_UAT_RESOURCE_GROUP"
              data_factory="$AZURE_UAT_DATA_FACTORY"
              ;;
            prd)
              subscription_id="$AZURE_PROD_SUBSCRIPTION_ID"
              client_id="$AZURE_PROD_CLIENT_ID"
              resource_group="$AZURE_PROD_RESOURCE_GROUP"
              data_factory="$AZURE_PROD_DATA_FACTORY"
              ;;
            *)
              echo "ERROR: Unsupported infra environment '$infra_env'."
              exit 1
              ;;
          esac

          {
            echo "INFRA_ENVIRONMENT_NAME=$infra_env"
            echo "OVERRIDES_ENVIRONMENT_NAME=$overrides_env"
            echo "ENV_OVERRIDES_FILE=$env_overrides_file"
            echo "ENV_ADF_CONFIG_FILE=$env_adf_config_file"
            echo "RESOURCE_GROUP=$resource_group"
            echo "DATA_FACTORY=$data_factory"
            echo "SUBSCRIPTION_ID=$subscription_id"
            echo "CLIENT_ID=$client_id"
          } >> "$GITHUB_ENV"

          {
            echo "subscription_id=$subscription_id"
            echo "client_id=$client_id"
          } >> "$GITHUB_OUTPUT"

      - name: Validate environment mapping
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUBSCRIPTION_ID:-}" ]; then
            echo "ERROR: SUBSCRIPTION_ID resolved to empty for environment '$ENVIRONMENT_NAME'."
            exit 1
          fi

          if [ -z "${CLIENT_ID:-}" ]; then
            echo "ERROR: CLIENT_ID resolved to empty for environment '$ENVIRONMENT_NAME'."
            exit 1
          fi

          echo "Input environment         : $ENVIRONMENT_NAME"
          echo "Infra environment target  : $INFRA_ENVIRONMENT_NAME"
          echo "Overrides environment     : $OVERRIDES_ENVIRONMENT_NAME"
          echo "ADF resource group        : $RESOURCE_GROUP"
          echo "ADF factory               : $DATA_FACTORY"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ADF utilities package
        run: npm install
        working-directory: ${{ env.ADF_RESOURCES_PATH }}

      - name: Export ARM Template
        shell: bash
        run: |
          set -euo pipefail
          adf_id="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"

          # Export can fail transiently if DNS/network to adf.azure.com is unstable; retry a few times.
          attempts=0
          until [ "$attempts" -ge 3 ]; do
            attempts=$((attempts + 1))
            echo "Export attempt $attempts/3..."

            if npm run build export \
              "${{ github.workspace }}/${{ env.ADF_RESOURCES_PATH }}" \
              "$adf_id" \
              "armTemplate"; then
              echo "ARM export completed."
              break
            fi

            if [ "$attempts" -lt 3 ]; then
              echo "Export failed on attempt $attempts. Retrying..."
            else
              echo "ERROR: ARM export failed after 3 attempts."
              exit 1
            fi
          done
        working-directory: ${{ env.ADF_RESOURCES_PATH }}

      - name: Validate ARM JSON filenames
        shell: bash
        run: |
          set -euo pipefail
          export_dir="${{ env.ARM_OUTPUT_DIR }}"
          template_path="$export_dir/${{ env.ARM_TEMPLATE_JSON }}"
          params_path="$export_dir/${{ env.ARM_PARAMETERS_JSON }}"

          echo "Validating expected ARM JSON filenames in: $export_dir"
          [ -f "$template_path" ] || { echo "ERROR: Missing template file: $template_path"; exit 1; }
          [ -f "$params_path" ] || { echo "ERROR: Missing parameters file: $params_path"; exit 1; }
          echo "Found template file: $template_path"
          echo "Found parameters file: $params_path"
          echo "Generated parameters file content ($params_path):"
          cat "$params_path"

      - name: Publish ARM template
        uses: actions/upload-artifact@v4
        with:
          name: adf-artifact-manual-${{ inputs.environment_name }}
          path: ${{ env.ARM_OUTPUT_DIR }}
          if-no-files-found: error

      - name: Copy ARM template to root
        shell: bash
        run: cp -a "${{ env.ARM_OUTPUT_DIR }}/." .

      - name: AZ OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ steps.resolve_env.outputs.client_id }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.resolve_env.outputs.subscription_id }}

      - name: Capture trigger inventory from trigger folder
        shell: bash
        run: |
          set -euo pipefail
          trigger_inventory_file="$RUNNER_TEMP/adf_trigger_inventory.tsv"
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          : > "$trigger_inventory_file"
          : > "$restart_file"

          if [ ! -d "$TRIGGER_PATH" ]; then
            echo "No trigger folder at $TRIGGER_PATH -- skipping trigger management."
            echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
            echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"
            exit 0
          fi

          shopt -s nullglob
          trigger_files=("$TRIGGER_PATH"/*.json)

          if [ ${#trigger_files[@]} -eq 0 ]; then
            echo "No trigger definition files found in $TRIGGER_PATH"
          else
            for trigger_file in "${trigger_files[@]}"; do
              trigger_name=$(jq -r '.name // empty' "$trigger_file" 2>/dev/null || true)
              if [ -z "$trigger_name" ]; then
                trigger_name=$(basename "$trigger_file" .json)
              fi

              runtime_state=$(jq -r '.properties.runtimeState // "NotFound"' "$trigger_file" 2>/dev/null || true)

              if [ -z "$runtime_state" ]; then
                runtime_state="NotFound"
              fi

              printf '%s\t%s\n' "$trigger_name" "$runtime_state" >> "$trigger_inventory_file"
              echo "Trigger inventory: $trigger_name => $runtime_state"

              if [ "$runtime_state" = "Started" ]; then
                echo "Trigger marked for restart: $trigger_name"
                echo "$trigger_name" >> "$restart_file"
              fi
            done
          fi

          echo "Captured trigger inventory:"
          cat "$trigger_inventory_file"

          if [ -s "$restart_file" ]; then
            echo "Triggers marked for restart:"
            cat "$restart_file"
          else
            echo "No triggers are in Started state."
          fi

          echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Stop started ADF triggers before deploy
        shell: bash
        run: |
          set -euo pipefail
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          runtime_snapshot_file="$RUNNER_TEMP/adf_triggers_runtime_snapshot.json"

          sub_id="$SUBSCRIPTION_ID"
          rg="$RESOURCE_GROUP"
          df="$DATA_FACTORY"
          base="https://management.azure.com/subscriptions/$sub_id/resourceGroups/$rg/providers/Microsoft.DataFactory/factories/$df"
          api="api-version=2018-06-01"

          echo "Finding started triggers in $DATA_FACTORY..."
          az rest --method get --url "$base/triggers?$api" -o json > "$runtime_snapshot_file"

          if ! jq -e '.value[] | select(.properties.runtimeState == "Started")' "$runtime_snapshot_file" >/dev/null; then
            echo "No started triggers found."
          else
            while IFS= read -r trigger_name; do
              [ -z "$trigger_name" ] && continue
              echo "Stopping trigger: $trigger_name"
              az rest --method post --url "$base/triggers/$trigger_name/stop?$api" >/dev/null
              if ! grep -Fxq "$trigger_name" "$restart_file" 2>/dev/null; then
                echo "$trigger_name" >> "$restart_file"
              fi
            done < <(jq -r '.value[] | select(.properties.runtimeState == "Started") | .name' "$runtime_snapshot_file")
          fi

          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

          if [ -s "$restart_file" ]; then
            restart_count=$(wc -l < "$restart_file")
            echo "All triggers in restart list ($restart_count):"
            cat "$restart_file"
          else
            echo "All triggers in restart list: none"
          fi

      - name: Deploy resources with Azure CLI
        shell: bash
        run: |
          set -euo pipefail
          template_file="${{ env.ARM_TEMPLATE_JSON }}"
          parameter_file="${{ env.ARM_PARAMETERS_JSON }}"
          az_parameter_file="az.parameters.json"

          echo "Validating JSON structure of ARM files..."
          python3 adf/deploy/scripts/validate_arm_json.py \
            "$template_file" "$parameter_file"

          echo "Building Azure CLI parameter file..."
          python3 adf/deploy/scripts/build_az_parameters_file.py \
            "$parameter_file" "$az_parameter_file"

          overrides_file="$ENV_OVERRIDES_FILE"
          if [ ! -f "$overrides_file" ]; then
            echo "ERROR: Missing environment overrides file: $overrides_file"
            exit 1
          fi

          echo "Applying environment overrides to deployment file only: $overrides_file"
          python3 adf/deploy/scripts/apply_az_parameter_overrides.py \
            "$az_parameter_file" "$overrides_file"

          adf_config_file="$ENV_ADF_CONFIG_FILE"
          if [ ! -f "$adf_config_file" ]; then
            echo "ERROR: Missing ADF environment configuration: $adf_config_file"
            exit 1
          fi
          echo "Applying ADF environment configuration: $adf_config_file"
          python3 adf/deploy/scripts/transform_adf_template.py \
            "$template_file" "$adf_config_file"

          echo "Deployment parameters file used by Azure CLI: $az_parameter_file"
          cat "$az_parameter_file"

          echo "ARM template file used by Azure CLI: $template_file"
          cat "$template_file"

          echo "Creating ARM deployment with Azure CLI..."
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$template_file" \
            --parameters "@$az_parameter_file" \
            --output json

      - name: Restart previously started ADF triggers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          restart_file="${TRIGGERS_TO_RESTART_FILE:-}"
          if [ -z "$restart_file" ] || [ ! -f "$restart_file" ] || [ ! -s "$restart_file" ]; then
            echo "No triggers to restart."
            exit 0
          fi

          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          while IFS= read -r trigger_name; do
            [ -z "$trigger_name" ] && continue
            echo "Starting trigger: $trigger_name"
            az rest --method post --url "$base/triggers/$trigger_name/start?$api" >/dev/null
          done < "$restart_file"