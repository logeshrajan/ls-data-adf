name: ADF CD Pipeline

run-name: ${{ format('CD - {0}', github.event.workflow_run.display_title) }}

# -----------------------------------------------------------------------------
# Triggers
#   successful PR CI -> SIT (approval) -> UAT (approval)
#                     -> PROD (approval) -> auto-merge to main
#   DEV is managed by ADF Studio Publish - not by this pipeline.
# -----------------------------------------------------------------------------
on:
  workflow_run:
    workflows: ["CI Workflow"]
    types: [completed]

permissions:
  actions: read
  id-token: write
  contents: write      # required for auto-merge after PROD
  pull-requests: write # required for auto-merge after PROD

env:
  ADF_RESOURCES_PATH: ./adf/adf_resources
  TRIGGER_PATH: ./adf/adf_resources/trigger
  ARM_OUTPUT_DIR: ./adf/adf_resources/armTemplate
  ARM_TEMPLATE_JSON: ARMTemplateForFactory.json
  ARM_PARAMETERS_JSON: ARMTemplateParametersForFactory.json
  ARM_ARTIFACT_NAME: adf-arm-artifact
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

jobs:
  # ---------------------------------------------------------------------------
  #  CD - SIT  (approval gate)
  #  SIT lead / tech lead must approve. Also verifies the branch is rebased
  #  onto the latest main before allowing entry to UAT.
  #  Queued globally: one PR in SIT at a time across all concurrent PRs.
  # ---------------------------------------------------------------------------
  deploy_sit:
    name: Deploy - SIT
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: sit
    concurrency:
      group: adf-deploy-sit
      cancel-in-progress: false
    env:
      ENVIRONMENT_NAME: sit
      SUBSCRIPTION_ID: ${{ vars.AZURE_SIT_SUBSCRIPTION_ID }}
      CLIENT_ID: ${{ vars.AZURE_SIT_CLIENT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_SIT_RESOURCE_GROUP }}
      DATA_FACTORY: ${{ vars.AZURE_SIT_DATA_FACTORY }}
    steps:
      - name: Verify CI commit is latest PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$SOURCE_SHA" != "$latest_sha" ]; then
            echo "ERROR: CI commit $SOURCE_SHA is stale; latest PR commit is $latest_sha."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARM_ARTIFACT_NAME }}
          path: ${{ env.ARM_OUTPUT_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve environment config
        shell: bash
        run: |
          set -euo pipefail
          env_name="$ENVIRONMENT_NAME"
          {
            echo "ENV_OVERRIDES_FILE=./adf/deploy/overrides/${env_name}.overrides.json"
            echo "ENV_TEMPLATE_OVERRIDES_FILE=./adf/deploy/overrides/${env_name}.template.overrides.json"
          } >> "$GITHUB_ENV"
          echo "Environment    : $env_name"
          echo "Resource group : $RESOURCE_GROUP"
          echo "Data factory   : $DATA_FACTORY"

      - name: Validate environment config
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUBSCRIPTION_ID:-}" ] || { echo "ERROR: SUBSCRIPTION_ID is empty."; exit 1; }
          [ -n "${CLIENT_ID:-}" ]       || { echo "ERROR: CLIENT_ID is empty.";       exit 1; }

      - name: AZ OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Capture trigger inventory from trigger folder
        shell: bash
        run: |
          set -euo pipefail
          trigger_inventory_file="$RUNNER_TEMP/adf_trigger_inventory.tsv"
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          : > "$trigger_inventory_file"
          : > "$restart_file"

          if [ ! -d "$TRIGGER_PATH" ]; then
            echo "No trigger folder at $TRIGGER_PATH -- skipping trigger management."
            echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
            echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"
            exit 0
          fi

          shopt -s nullglob
          trigger_files=("$TRIGGER_PATH"/*.json)
          if [ ${#trigger_files[@]} -eq 0 ]; then
            echo "No trigger definition files found in $TRIGGER_PATH"
          else
            for trigger_file in "${trigger_files[@]}"; do
              trigger_name=$(jq -r '.name // empty' "$trigger_file" 2>/dev/null || true)
              [ -z "$trigger_name" ] && trigger_name=$(basename "$trigger_file" .json)
              runtime_state=$(jq -r '.properties.runtimeState // "NotFound"' "$trigger_file" 2>/dev/null || true)
              [ -z "$runtime_state" ] && runtime_state="NotFound"
              printf '%s\t%s\n' "$trigger_name" "$runtime_state" >> "$trigger_inventory_file"
              echo "Trigger inventory: $trigger_name => $runtime_state"
              if [ "$runtime_state" = "Started" ]; then
                echo "Trigger marked for restart: $trigger_name"
                echo "$trigger_name" >> "$restart_file"
              fi
            done
          fi

          echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Stop started ADF triggers before deploy
        shell: bash
        run: |
          set -euo pipefail
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          runtime_snapshot_file="$RUNNER_TEMP/adf_triggers_runtime_snapshot.json"
          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          az rest --method get --url "$base/triggers?$api" -o json > "$runtime_snapshot_file"

          if ! jq -e '.value[] | select(.properties.runtimeState == "Started")' "$runtime_snapshot_file" >/dev/null; then
            echo "No started triggers found."
          else
            while IFS= read -r trigger_name; do
              [ -z "$trigger_name" ] && continue
              echo "Stopping trigger: $trigger_name"
              az rest --method post --url "$base/triggers/$trigger_name/stop?$api" >/dev/null
              grep -Fxq "$trigger_name" "$restart_file" 2>/dev/null || echo "$trigger_name" >> "$restart_file"
            done < <(jq -r '.value[] | select(.properties.runtimeState == "Started") | .name' "$runtime_snapshot_file")
          fi

          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Ensure required integration runtimes exist
        shell: bash
        run: |
          set -euo pipefail
          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"
          ir_dir="${{ env.ADF_RESOURCES_PATH }}/integrationRuntime"

          if [ ! -d "$ir_dir" ]; then
            echo "No integrationRuntime folder ($ir_dir). Skipping."
            exit 0
          fi

          shopt -s nullglob
          for ir_file in "$ir_dir"/*.json; do
            repo_name=$(jq -r '.name' "$ir_file")
            env_name="$repo_name"
            if [ -f "$ENV_TEMPLATE_OVERRIDES_FILE" ]; then
              env_name=$(jq -r --arg n "$repo_name" '.[$n] // $n' "$ENV_TEMPLATE_OVERRIDES_FILE")
            fi

            echo "Checking IR: $env_name (source: $(basename "$ir_file"))"
            exists=$(az rest --method get \
              --url "$base/integrationRuntimes/$env_name?$api" \
              --query "name" -o tsv 2>/dev/null || true)

            if [ -n "$exists" ]; then
              echo "  Already present. Skipping."
            else
              echo "  Missing. Creating: $env_name"
              body_file="$RUNNER_TEMP/${env_name}.ir.json"
              jq --arg n "$env_name" '{name: $n, properties: .properties}' "$ir_file" > "$body_file"
              az rest --method put \
                --url "$base/integrationRuntimes/$env_name?$api" \
                --body "@$body_file" >/dev/null
              echo "  Created: $env_name"
            fi
          done

      - name: Deploy ARM template
        shell: bash
        run: |
          set -euo pipefail
          template_file="${{ env.ARM_TEMPLATE_JSON }}"
          parameter_file="${{ env.ARM_PARAMETERS_JSON }}"
          az_parameter_file="az.parameters.json"

          cp -a "${{ env.ARM_OUTPUT_DIR }}/." .

          python3 adf/deploy/scripts/validate_arm_json.py "$template_file" "$parameter_file"
          python3 adf/deploy/scripts/build_az_parameters_file.py "$parameter_file" "$az_parameter_file"

          [ -f "$ENV_OVERRIDES_FILE" ] || { echo "ERROR: Missing $ENV_OVERRIDES_FILE"; exit 1; }
          python3 adf/deploy/scripts/apply_az_parameter_overrides.py "$az_parameter_file" "$ENV_OVERRIDES_FILE"

          if [ -f "$ENV_TEMPLATE_OVERRIDES_FILE" ]; then
            python3 adf/deploy/scripts/apply_az_template_overrides.py "$template_file" "$ENV_TEMPLATE_OVERRIDES_FILE"
          fi

          before_count=$(jq '[.resources[] | select(.type == "Microsoft.DataFactory/factories/integrationRuntimes")] | length' "$template_file")
          jq '
            .resources |= (
              map(select(.type != "Microsoft.DataFactory/factories/integrationRuntimes"))
              | map(if has("dependsOn") then .dependsOn |= map(select(test("/integrationRuntimes/") | not)) else . end)
            )
          ' "$template_file" > "${template_file}.tmp" && mv "${template_file}.tmp" "$template_file"
          echo "Removed $before_count integration-runtime resource(s)."

          set +e
          deploy_output=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$template_file" \
            --parameters "@$az_parameter_file" \
            --output json 2>&1)
          deploy_exit=$?
          set -e
          echo "$deploy_output"

          if [ "$deploy_exit" -ne 0 ]; then
            if echo "$deploy_output" | grep -qi '"code":"InvalidResourceRequest"' && \
               echo "$deploy_output" | grep -qi "ManagedPrivateEndpoint" && \
               echo "$deploy_output" | grep -qi "already exist"; then
              echo "Warning: ManagedPrivateEndpoint already exists - ignoring idempotent error."
            else
              echo "ERROR: Deployment failed."
              exit "$deploy_exit"
            fi
          fi

      - name: Restart previously started ADF triggers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          restart_file="${TRIGGERS_TO_RESTART_FILE:-}"
          if [ -z "$restart_file" ] || [ ! -f "$restart_file" ] || [ ! -s "$restart_file" ]; then
            echo "No triggers to restart."
            exit 0
          fi

          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          while IFS= read -r trigger_name; do
            [ -z "$trigger_name" ] && continue
            echo "Starting trigger: $trigger_name"
            az rest --method post --url "$base/triggers/$trigger_name/start?$api" >/dev/null
          done < "$restart_file"


  # ---------------------------------------------------------------------------
  #  CD - UAT  (approval gate)
  #  QA lead / business analyst must approve. Runs after SIT succeeds.
  #  Queued globally: only one PR in UAT at a time across all concurrent PRs.
  #  The SIT approver must confirm the branch is rebased before this runs.
  # ---------------------------------------------------------------------------
  deploy_uat:
    name: Deploy - UAT
    runs-on: ubuntu-latest
    needs: [deploy_sit]
    if: github.event_name == 'workflow_run'
    environment: uat
    concurrency:
      group: adf-deploy-uat
      cancel-in-progress: false
    env:
      ENVIRONMENT_NAME: uat
      SUBSCRIPTION_ID: ${{ vars.AZURE_UAT_SUBSCRIPTION_ID }}
      CLIENT_ID: ${{ vars.AZURE_UAT_CLIENT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_UAT_RESOURCE_GROUP }}
      DATA_FACTORY: ${{ vars.AZURE_UAT_DATA_FACTORY }}
    steps:
      - name: Verify CI commit is latest PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$SOURCE_SHA" != "$latest_sha" ]; then
            echo "ERROR: CI commit $SOURCE_SHA is stale; latest PR commit is $latest_sha."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARM_ARTIFACT_NAME }}
          path: ${{ env.ARM_OUTPUT_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve environment config
        shell: bash
        run: |
          set -euo pipefail
          env_name="$ENVIRONMENT_NAME"
          {
            echo "ENV_OVERRIDES_FILE=./adf/deploy/overrides/${env_name}.overrides.json"
            echo "ENV_TEMPLATE_OVERRIDES_FILE=./adf/deploy/overrides/${env_name}.template.overrides.json"
          } >> "$GITHUB_ENV"
          echo "Environment    : $env_name"
          echo "Resource group : $RESOURCE_GROUP"
          echo "Data factory   : $DATA_FACTORY"

      - name: Validate environment config
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUBSCRIPTION_ID:-}" ] || { echo "ERROR: SUBSCRIPTION_ID is empty."; exit 1; }
          [ -n "${CLIENT_ID:-}" ]       || { echo "ERROR: CLIENT_ID is empty.";       exit 1; }

      - name: AZ OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Capture trigger inventory from trigger folder
        shell: bash
        run: |
          set -euo pipefail
          trigger_inventory_file="$RUNNER_TEMP/adf_trigger_inventory.tsv"
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          : > "$trigger_inventory_file"
          : > "$restart_file"

          if [ ! -d "$TRIGGER_PATH" ]; then
            echo "No trigger folder at $TRIGGER_PATH -- skipping trigger management."
            echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
            echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"
            exit 0
          fi

          shopt -s nullglob
          trigger_files=("$TRIGGER_PATH"/*.json)
          if [ ${#trigger_files[@]} -eq 0 ]; then
            echo "No trigger definition files found in $TRIGGER_PATH"
          else
            for trigger_file in "${trigger_files[@]}"; do
              trigger_name=$(jq -r '.name // empty' "$trigger_file" 2>/dev/null || true)
              [ -z "$trigger_name" ] && trigger_name=$(basename "$trigger_file" .json)
              runtime_state=$(jq -r '.properties.runtimeState // "NotFound"' "$trigger_file" 2>/dev/null || true)
              [ -z "$runtime_state" ] && runtime_state="NotFound"
              printf '%s\t%s\n' "$trigger_name" "$runtime_state" >> "$trigger_inventory_file"
              echo "Trigger inventory: $trigger_name => $runtime_state"
              if [ "$runtime_state" = "Started" ]; then
                echo "Trigger marked for restart: $trigger_name"
                echo "$trigger_name" >> "$restart_file"
              fi
            done
          fi

          echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Stop started ADF triggers before deploy
        shell: bash
        run: |
          set -euo pipefail
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          runtime_snapshot_file="$RUNNER_TEMP/adf_triggers_runtime_snapshot.json"
          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          az rest --method get --url "$base/triggers?$api" -o json > "$runtime_snapshot_file"

          if ! jq -e '.value[] | select(.properties.runtimeState == "Started")' "$runtime_snapshot_file" >/dev/null; then
            echo "No started triggers found."
          else
            while IFS= read -r trigger_name; do
              [ -z "$trigger_name" ] && continue
              echo "Stopping trigger: $trigger_name"
              az rest --method post --url "$base/triggers/$trigger_name/stop?$api" >/dev/null
              grep -Fxq "$trigger_name" "$restart_file" 2>/dev/null || echo "$trigger_name" >> "$restart_file"
            done < <(jq -r '.value[] | select(.properties.runtimeState == "Started") | .name' "$runtime_snapshot_file")
          fi

          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Ensure required integration runtimes exist
        shell: bash
        run: |
          set -euo pipefail
          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"
          ir_dir="${{ env.ADF_RESOURCES_PATH }}/integrationRuntime"

          if [ ! -d "$ir_dir" ]; then
            echo "No integrationRuntime folder ($ir_dir). Skipping."
            exit 0
          fi

          shopt -s nullglob
          for ir_file in "$ir_dir"/*.json; do
            repo_name=$(jq -r '.name' "$ir_file")
            env_name="$repo_name"
            if [ -f "$ENV_TEMPLATE_OVERRIDES_FILE" ]; then
              env_name=$(jq -r --arg n "$repo_name" '.[$n] // $n' "$ENV_TEMPLATE_OVERRIDES_FILE")
            fi

            echo "Checking IR: $env_name (source: $(basename "$ir_file"))"
            exists=$(az rest --method get \
              --url "$base/integrationRuntimes/$env_name?$api" \
              --query "name" -o tsv 2>/dev/null || true)

            if [ -n "$exists" ]; then
              echo "  Already present. Skipping."
            else
              echo "  Missing. Creating: $env_name"
              body_file="$RUNNER_TEMP/${env_name}.ir.json"
              jq --arg n "$env_name" '{name: $n, properties: .properties}' "$ir_file" > "$body_file"
              az rest --method put \
                --url "$base/integrationRuntimes/$env_name?$api" \
                --body "@$body_file" >/dev/null
              echo "  Created: $env_name"
            fi
          done

      - name: Deploy ARM template
        shell: bash
        run: |
          set -euo pipefail
          template_file="${{ env.ARM_TEMPLATE_JSON }}"
          parameter_file="${{ env.ARM_PARAMETERS_JSON }}"
          az_parameter_file="az.parameters.json"

          cp -a "${{ env.ARM_OUTPUT_DIR }}/." .

          python3 adf/deploy/scripts/validate_arm_json.py "$template_file" "$parameter_file"
          python3 adf/deploy/scripts/build_az_parameters_file.py "$parameter_file" "$az_parameter_file"

          [ -f "$ENV_OVERRIDES_FILE" ] || { echo "ERROR: Missing $ENV_OVERRIDES_FILE"; exit 1; }
          python3 adf/deploy/scripts/apply_az_parameter_overrides.py "$az_parameter_file" "$ENV_OVERRIDES_FILE"

          if [ -f "$ENV_TEMPLATE_OVERRIDES_FILE" ]; then
            python3 adf/deploy/scripts/apply_az_template_overrides.py "$template_file" "$ENV_TEMPLATE_OVERRIDES_FILE"
          fi

          before_count=$(jq '[.resources[] | select(.type == "Microsoft.DataFactory/factories/integrationRuntimes")] | length' "$template_file")
          jq '
            .resources |= (
              map(select(.type != "Microsoft.DataFactory/factories/integrationRuntimes"))
              | map(if has("dependsOn") then .dependsOn |= map(select(test("/integrationRuntimes/") | not)) else . end)
            )
          ' "$template_file" > "${template_file}.tmp" && mv "${template_file}.tmp" "$template_file"
          echo "Removed $before_count integration-runtime resource(s)."

          set +e
          deploy_output=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$template_file" \
            --parameters "@$az_parameter_file" \
            --output json 2>&1)
          deploy_exit=$?
          set -e
          echo "$deploy_output"

          if [ "$deploy_exit" -ne 0 ]; then
            if echo "$deploy_output" | grep -qi '"code":"InvalidResourceRequest"' && \
               echo "$deploy_output" | grep -qi "ManagedPrivateEndpoint" && \
               echo "$deploy_output" | grep -qi "already exist"; then
              echo "Warning: ManagedPrivateEndpoint already exists - ignoring idempotent error."
            else
              echo "ERROR: Deployment failed."
              exit "$deploy_exit"
            fi
          fi

      - name: Restart previously started ADF triggers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          restart_file="${TRIGGERS_TO_RESTART_FILE:-}"
          if [ -z "$restart_file" ] || [ ! -f "$restart_file" ] || [ ! -s "$restart_file" ]; then
            echo "No triggers to restart."
            exit 0
          fi

          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          while IFS= read -r trigger_name; do
            [ -z "$trigger_name" ] && continue
            echo "Starting trigger: $trigger_name"
            az rest --method post --url "$base/triggers/$trigger_name/start?$api" >/dev/null
          done < "$restart_file"


  # ---------------------------------------------------------------------------
  #  CD - PROD  (approval gate)
  #  Release manager must approve. Runs after UAT succeeds.
  #  Queued globally: never cancels a run that may be mid-deployment.
  #  Auto-merges the PR to main after a successful deployment.
  # ---------------------------------------------------------------------------
  deploy_prod:
    name: Deploy - PROD
    runs-on: ubuntu-latest
    needs: [deploy_uat]
    if: github.event_name == 'workflow_run'
    environment: prd
    concurrency:
      group: adf-deploy-prd
      cancel-in-progress: false
    env:
      ENVIRONMENT_NAME: prd
      SUBSCRIPTION_ID: ${{ vars.AZURE_PROD_SUBSCRIPTION_ID }}
      CLIENT_ID: ${{ vars.AZURE_PROD_CLIENT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_PROD_RESOURCE_GROUP }}
      DATA_FACTORY: ${{ vars.AZURE_PROD_DATA_FACTORY }}
    steps:
      - name: Verify CI commit is latest PR head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$SOURCE_SHA" != "$latest_sha" ]; then
            echo "ERROR: CI commit $SOURCE_SHA is stale; latest PR commit is $latest_sha."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARM_ARTIFACT_NAME }}
          path: ${{ env.ARM_OUTPUT_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve environment config
        shell: bash
        run: |
          set -euo pipefail
          env_name="$ENVIRONMENT_NAME"
          {
            echo "ENV_OVERRIDES_FILE=./adf/deploy/overrides/${env_name}.overrides.json"
            echo "ENV_TEMPLATE_OVERRIDES_FILE=./adf/deploy/overrides/${env_name}.template.overrides.json"
          } >> "$GITHUB_ENV"
          echo "Environment    : $env_name"
          echo "Resource group : $RESOURCE_GROUP"
          echo "Data factory   : $DATA_FACTORY"

      - name: Validate environment config
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SUBSCRIPTION_ID:-}" ] || { echo "ERROR: SUBSCRIPTION_ID is empty."; exit 1; }
          [ -n "${CLIENT_ID:-}" ]       || { echo "ERROR: CLIENT_ID is empty.";       exit 1; }

      - name: AZ OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Capture trigger inventory from trigger folder
        shell: bash
        run: |
          set -euo pipefail
          trigger_inventory_file="$RUNNER_TEMP/adf_trigger_inventory.tsv"
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          : > "$trigger_inventory_file"
          : > "$restart_file"

          if [ ! -d "$TRIGGER_PATH" ]; then
            echo "No trigger folder at $TRIGGER_PATH -- skipping trigger management."
            echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
            echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"
            exit 0
          fi

          shopt -s nullglob
          trigger_files=("$TRIGGER_PATH"/*.json)
          if [ ${#trigger_files[@]} -eq 0 ]; then
            echo "No trigger definition files found in $TRIGGER_PATH"
          else
            for trigger_file in "${trigger_files[@]}"; do
              trigger_name=$(jq -r '.name // empty' "$trigger_file" 2>/dev/null || true)
              [ -z "$trigger_name" ] && trigger_name=$(basename "$trigger_file" .json)
              runtime_state=$(jq -r '.properties.runtimeState // "NotFound"' "$trigger_file" 2>/dev/null || true)
              [ -z "$runtime_state" ] && runtime_state="NotFound"
              printf '%s\t%s\n' "$trigger_name" "$runtime_state" >> "$trigger_inventory_file"
              echo "Trigger inventory: $trigger_name => $runtime_state"
              if [ "$runtime_state" = "Started" ]; then
                echo "Trigger marked for restart: $trigger_name"
                echo "$trigger_name" >> "$restart_file"
              fi
            done
          fi

          echo "TRIGGER_INVENTORY_FILE=$trigger_inventory_file" >> "$GITHUB_ENV"
          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Stop started ADF triggers before deploy
        shell: bash
        run: |
          set -euo pipefail
          restart_file="$RUNNER_TEMP/adf_triggers_to_restart.txt"
          runtime_snapshot_file="$RUNNER_TEMP/adf_triggers_runtime_snapshot.json"
          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          az rest --method get --url "$base/triggers?$api" -o json > "$runtime_snapshot_file"

          if ! jq -e '.value[] | select(.properties.runtimeState == "Started")' "$runtime_snapshot_file" >/dev/null; then
            echo "No started triggers found."
          else
            while IFS= read -r trigger_name; do
              [ -z "$trigger_name" ] && continue
              echo "Stopping trigger: $trigger_name"
              az rest --method post --url "$base/triggers/$trigger_name/stop?$api" >/dev/null
              grep -Fxq "$trigger_name" "$restart_file" 2>/dev/null || echo "$trigger_name" >> "$restart_file"
            done < <(jq -r '.value[] | select(.properties.runtimeState == "Started") | .name' "$runtime_snapshot_file")
          fi

          echo "TRIGGERS_TO_RESTART_FILE=$restart_file" >> "$GITHUB_ENV"

      - name: Ensure required integration runtimes exist
        shell: bash
        run: |
          set -euo pipefail
          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"
          ir_dir="${{ env.ADF_RESOURCES_PATH }}/integrationRuntime"

          if [ ! -d "$ir_dir" ]; then
            echo "No integrationRuntime folder ($ir_dir). Skipping."
            exit 0
          fi

          shopt -s nullglob
          for ir_file in "$ir_dir"/*.json; do
            repo_name=$(jq -r '.name' "$ir_file")
            env_name="$repo_name"
            if [ -f "$ENV_TEMPLATE_OVERRIDES_FILE" ]; then
              env_name=$(jq -r --arg n "$repo_name" '.[$n] // $n' "$ENV_TEMPLATE_OVERRIDES_FILE")
            fi

            echo "Checking IR: $env_name (source: $(basename "$ir_file"))"
            exists=$(az rest --method get \
              --url "$base/integrationRuntimes/$env_name?$api" \
              --query "name" -o tsv 2>/dev/null || true)

            if [ -n "$exists" ]; then
              echo "  Already present. Skipping."
            else
              echo "  Missing. Creating: $env_name"
              body_file="$RUNNER_TEMP/${env_name}.ir.json"
              jq --arg n "$env_name" '{name: $n, properties: .properties}' "$ir_file" > "$body_file"
              az rest --method put \
                --url "$base/integrationRuntimes/$env_name?$api" \
                --body "@$body_file" >/dev/null
              echo "  Created: $env_name"
            fi
          done

      - name: Deploy ARM template
        shell: bash
        run: |
          set -euo pipefail
          template_file="${{ env.ARM_TEMPLATE_JSON }}"
          parameter_file="${{ env.ARM_PARAMETERS_JSON }}"
          az_parameter_file="az.parameters.json"

          cp -a "${{ env.ARM_OUTPUT_DIR }}/." .

          python3 adf/deploy/scripts/validate_arm_json.py "$template_file" "$parameter_file"
          python3 adf/deploy/scripts/build_az_parameters_file.py "$parameter_file" "$az_parameter_file"

          [ -f "$ENV_OVERRIDES_FILE" ] || { echo "ERROR: Missing $ENV_OVERRIDES_FILE"; exit 1; }
          python3 adf/deploy/scripts/apply_az_parameter_overrides.py "$az_parameter_file" "$ENV_OVERRIDES_FILE"

          if [ -f "$ENV_TEMPLATE_OVERRIDES_FILE" ]; then
            python3 adf/deploy/scripts/apply_az_template_overrides.py "$template_file" "$ENV_TEMPLATE_OVERRIDES_FILE"
          fi

          before_count=$(jq '[.resources[] | select(.type == "Microsoft.DataFactory/factories/integrationRuntimes")] | length' "$template_file")
          jq '
            .resources |= (
              map(select(.type != "Microsoft.DataFactory/factories/integrationRuntimes"))
              | map(if has("dependsOn") then .dependsOn |= map(select(test("/integrationRuntimes/") | not)) else . end)
            )
          ' "$template_file" > "${template_file}.tmp" && mv "${template_file}.tmp" "$template_file"
          echo "Removed $before_count integration-runtime resource(s)."

          set +e
          deploy_output=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$template_file" \
            --parameters "@$az_parameter_file" \
            --output json 2>&1)
          deploy_exit=$?
          set -e
          echo "$deploy_output"

          if [ "$deploy_exit" -ne 0 ]; then
            if echo "$deploy_output" | grep -qi '"code":"InvalidResourceRequest"' && \
               echo "$deploy_output" | grep -qi "ManagedPrivateEndpoint" && \
               echo "$deploy_output" | grep -qi "already exist"; then
              echo "Warning: ManagedPrivateEndpoint already exists - ignoring idempotent error."
            else
              echo "ERROR: Deployment failed."
              exit "$deploy_exit"
            fi
          fi

      - name: Restart previously started ADF triggers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          restart_file="${TRIGGERS_TO_RESTART_FILE:-}"
          if [ -z "$restart_file" ] || [ ! -f "$restart_file" ] || [ ! -s "$restart_file" ]; then
            echo "No triggers to restart."
            exit 0
          fi

          base="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DataFactory/factories/$DATA_FACTORY"
          api="api-version=2018-06-01"

          while IFS= read -r trigger_name; do
            [ -z "$trigger_name" ] && continue
            echo "Starting trigger: $trigger_name"
            az rest --method post --url "$base/triggers/$trigger_name/start?$api" >/dev/null
          done < "$restart_file"

      - name: Auto-merge PR to main after PROD
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Pipeline is the only entity that merges to main - never done manually.
          gh pr merge "$PR_NUMBER" --auto --merge


